<style>
  .zzr-wrap {
    --bg: #101218; --surface: #1F222A; --surface-2: #171A20;
    --line: #2E313A; --muted: #9CA3AF; --dim: #6B7280; --text: #F3F4F6;
    --accent: #DC0000; --accent-soft: #2A1216; --gold: #F4B740;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--bg);
    padding: 22px;
    border-radius: 20px;
    box-sizing: border-box;
  }
  .zzr-wrap * { box-sizing: border-box; }
  .zzr-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 14px; margin-bottom: 16px; }
  .zzr-head h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  .zzr-head .zzr-sub { font-size: 13px; color: var(--muted); }
  .zzr-chip {
    font-size: 12px; color: var(--dim); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px; white-space: nowrap;
  }
  .zzr-layout {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
    gap: 18px; align-items: start;
  }
  @media (max-width: 820px) { .zzr-layout { grid-template-columns: minmax(0, 1fr); } }

  .zzr-stage {
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 16px; padding: 8px; overflow: hidden;
  }
  .zzr-stage svg { display: block; width: 100%; height: auto; }

  /* 节点 */
  .zzr-node { cursor: pointer; }
  .zzr-node rect { transition: opacity .18s ease, stroke-width .18s ease, filter .18s ease; }
  .zzr-node .zzr-t1 { font-size: 19px; font-weight: 600; fill: #FFFFFF; }
  .zzr-node .zzr-t2 { font-size: 12.5px; fill: var(--muted); }
  .zzr-node .zzr-t3 { font-size: 11px; fill: var(--dim); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .zzr-node.is-dim { opacity: .22; }
  .zzr-node.is-active rect { stroke-width: 3; filter: drop-shadow(0 0 12px rgba(220, 0, 0, .55)); }
  .zzr-node:focus { outline: none; }
  .zzr-node:focus-visible rect { stroke: var(--gold); stroke-width: 3; }
  .zzr-node:hover rect { stroke-width: 2.5; }

  /* 连边 */
  .zzr-edge { transition: opacity .18s ease; }
  .zzr-line { fill: none; stroke-width: 2.2; transition: stroke-width .18s ease; }
  .zzr-fwd { stroke: var(--accent); }
  .zzr-back { stroke: var(--dim); stroke-dasharray: 7 7; }
  .zzr-elabel { font-size: 12px; fill: var(--muted); text-anchor: middle; }
  .zzr-edge.is-dim { opacity: .10; }
  .zzr-edge.is-hit .zzr-line { stroke-width: 4.2; }
  .zzr-edge.is-hit .zzr-elabel { fill: #FFFFFF; font-weight: 600; }

  /* 面板 */
  .zzr-panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px; min-height: 200px;
  }
  .zzr-panel h2 { font-size: 16px; margin: 0 0 4px; }
  .zzr-panel .zzr-route {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; color: var(--accent); word-break: break-all;
  }
  .zzr-panel .zzr-file {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; color: var(--dim); margin-top: 2px; word-break: break-all;
  }
  .zzr-panel .zzr-desc { font-size: 13px; color: var(--muted); line-height: 1.65; margin: 12px 0 0; }
  .zzr-sec { margin-top: 16px; }
  .zzr-sec > h3 {
    font-size: 11.5px; font-weight: 600; letter-spacing: 1px; color: var(--dim);
    margin: 0 0 8px; text-transform: uppercase;
  }
  .zzr-item {
    border-left: 2px solid var(--line); padding: 6px 0 6px 12px; margin-bottom: 8px;
  }
  .zzr-item.fwd { border-left-color: var(--accent); }
  .zzr-item.back { border-left-color: var(--dim); }
  .zzr-item .zzr-i1 { font-size: 13.5px; color: var(--text); }
  .zzr-item .zzr-i2 { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .zzr-ref {
    display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; color: var(--gold); background: rgba(244, 183, 64, .1);
    border-radius: 5px; padding: 1px 6px; margin-left: 6px; white-space: nowrap;
  }
  .zzr-empty { font-size: 12.5px; color: var(--dim); font-style: italic; }
  .zzr-hint { font-size: 12px; color: var(--dim); margin-top: 14px; }

  .zzr-reset {
    margin-top: 16px; font-size: 12.5px; color: var(--text); cursor: pointer;
    background: #2A2D36; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-family: inherit;
  }
  .zzr-reset:hover { border-color: var(--accent); color: #fff; }

  /* 图例 */
  .zzr-legend {
    display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 16px;
    font-size: 12.5px; color: var(--muted);
  }
  .zzr-legend .zzr-key { display: inline-flex; align-items: center; gap: 8px; }
  .zzr-swatch { width: 26px; height: 0; border-top-width: 2.5px; border-top-style: solid; border-radius: 2px; }
  .zzr-swatch.solid { border-color: var(--accent); }
  .zzr-swatch.dash { border-color: var(--dim); border-top-style: dashed; }
  .zzr-swatch.virtual { width: 16px; height: 12px; border: 1.5px dashed var(--dim); border-radius: 4px; }
</style>

<div class="zzr-wrap">
  <div class="zzr-head">
    <h1>zz-boardgame-uniapp · 页面跳转关系</h1>
    <span class="zzr-sub">4 个页面 · 无 tabBar · 全部 navigateTo 压栈</span>
    <span class="zzr-chip">点击节点查看该页出入口</span>
  </div>

  <div class="zzr-layout">
    <div class="zzr-stage">
      <svg viewBox="0 0 960 520" role="img" aria-label="页面跳转关系图">
        <defs>
          <marker id="zzr-ah-fwd" viewBox="0 0 10 10" refX="8.5" refY="5"
                  markerWidth="7" markerHeight="7" orient="auto-start-reverse">

          <marker id="zzr-ah-back" viewBox="0 0 10 10" refX="8.5" refY="5"
                  markerWidth="7" markerHeight="7" orient="auto-start-reverse">

        </defs>

        <!-- ===== 连边（先画，压在节点下方） ===== -->

          <path class="zzr-line zzr-fwd" d="M 205 245 Q 290 168 374 152" marker-end="url(#zzr-ah-fwd)"></path>

        <g class="zzr-edge" data-from="home" data-to="profile">
          <path class="zzr-line zzr-fwd" d="M 205 295 Q 290 372 374 390" marker-end="url(#zzr-ah-fwd)"></path>
          <text class="zzr-elabel" x="300" y="372">dock / 头像</text>
        </g>
        <g class="zzr-edge" data-from="home" data-to="room">
          <path class="zzr-line zzr-fwd" d="M 230 270 L 706 270" marker-end="url(#zzr-ah-fwd)"></path>

        <g class="zzr-edge" data-from="create" data-to="room">
          <path class="zzr-line zzr-fwd" d="M 558 150 Q 700 176 798 236" marker-end="url(#zzr-ah-fwd)"></path>
          <text class="zzr-elabel" x="694" y="188">发布后</text>
        </g>
        <g class="zzr-edge" data-from="share" data-to="room">
          <path class="zzr-line zzr-fwd" d="M 230 72 L 800 72 L 800 236" marker-end="url(#zzr-ah-fwd)"></path>
          <text class="zzr-elabel" x="515" y="62">分享卡片 path</text>
        </g>

        <!-- 返回边（goBackOrHome） -->
        <g class="zzr-edge" data-from="create" data-to="home" data-back="1">

        </g>
        <g class="zzr-edge" data-from="profile" data-to="home" data-back="1">
          <path class="zzr-line zzr-back" d="M 400 375 Q 312 316 218 278" marker-end="url(#zzr-ah-back)"></path>

        <g class="zzr-edge" data-from="room" data-to="home" data-back="1">
          <path class="zzr-line zzr-back" d="M 710 289 Q 470 302 234 289" marker-end="url(#zzr-ah-back)"></path>
          <text class="zzr-elabel" x="470" y="316">返回 goBackOrHome</text>
        </g>

        <!-- ===== 节点 ===== -->
        <g class="zzr-node" data-id="share" role="button" tabindex="0">
          <rect x="52" y="41" width="176" height="62" rx="16"
                fill="#171A20" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6 5"></rect>
          <text class="zzr-t1" x="140" y="70" text-anchor="middle">分享卡片 / 链接</text>
          <text class="zzr-t3" x="140" y="89" text-anchor="middle">站外入口</text>

        <g class="zzr-node" data-id="home" role="button" tabindex="0">
          <rect x="52" y="239" width="176" height="62" rx="16"
                fill="#2A1216" stroke="#DC0000" stroke-width="2"></rect>
          <text class="zzr-t1" x="140" y="268" text-anchor="middle">首页</text>
          <text class="zzr-t3" x="140" y="287" text-anchor="middle">pages/home/index</text>
        </g>

        <g class="zzr-node" data-id="create" role="button" tabindex="0">
          <rect x="380" y="101" width="176" height="62" rx="16"
                fill="#1F222A" stroke="#2E313A" stroke-width="1.8"></rect>
          <text class="zzr-t1" x="468" y="130" text-anchor="middle">创建比赛</text>
          <text class="zzr-t3" x="468" y="149" text-anchor="middle">pages/create/index</text>
        </g>

        <g class="zzr-node" data-id="profile" role="button" tabindex="0">
          <rect x="380" y="377" width="176" height="62" rx="16"
                fill="#1F222A" stroke="#2E313A" stroke-width="1.8"></rect>
          <text class="zzr-t1" x="468" y="406" text-anchor="middle">个人主页</text>
          <text class="zzr-t3" x="468" y="425" text-anchor="middle">pages/profile/index</text>
        </g>

        <g class="zzr-node" data-id="room" role="button" tabindex="0">
          <rect x="712" y="239" width="176" height="62" rx="16"
                fill="#1F222A" stroke="#2E313A" stroke-width="1.8"></rect>
          <text class="zzr-t1" x="800" y="268" text-anchor="middle">房间</text>
          <text class="zzr-t3" x="800" y="287" text-anchor="middle">pages/room/index</text>
        </g>
      </svg>
    </div>

    <aside class="zzr-panel" id="zzr-panel" aria-live="polite"></aside>
  </div>

  <div class="zzr-legend">
    <span class="zzr-key"><span class="zzr-swatch solid"></span>前进跳转 navigateTo（压栈）</span>
    <span class="zzr-key"><span class="zzr-swatch dash"></span>返回 goBackOrHome</span>
    <span class="zzr-key"><span class="zzr-swatch virtual"></span>站外入口 / 分享</span>
    <span class="zzr-key">无 tabBar · 无 switchTab · 无 redirectTo</span>
  </div>
</div>

<script>
(function () {
  var PAGES = {
    home: {
      name: '首页 · 启动页',
      route: 'pages/home/index',
      file: 'src/pages/home/index.vue',
      desc: 'pages.json 里注册的第一个页面，小程序启动即进入，是唯一入口页。没有 tabBar。',
      out: [
        ['→ 个人主页 profile', '点底部 dock-bar 整条 / 左下 dock-avatar', 'home:134'],
        ['→ 创建比赛 create', '点「创建比赛」主按钮', 'home:135'],
        ['→ 房间 room', 'uni.scanCode 扫码成功后跳转', 'home:139'],
        ['→ 房间 room', '「我有一个邀请链接」弹窗粘贴并确认', 'home:155']
      ],
      back: [['无上一页时 reLaunch 回本页', '任何页栈只剩 1 层时的兜底落点', 'nav.js:29']],
      inn: [],
      todo: 'logo、服务器「+」、赛事卡片「狼人杀房间待接入」、设置 目前只弹 toast，未接入跳转'
    },
    create: {
      name: '创建比赛',
      route: 'pages/create/index',
      file: 'src/pages/create/index.vue',
      desc: '从首页「创建比赛」进入。发布按钮需要点第二次才会进房间。',
      out: [
        ['→ 房间 room', 'onPublish：已发布状态下再次点击发布按钮', 'create:546'],
        ['→ 房间 room', 'onShareAppMessage 的 path（分享卡片被点开）', 'create:552']
      ],
      back: [['← 上一页 / 兜底回首页', '左上角返回按钮 goBackOrHome', 'create:6']],
      inn: [['首页 home → 本页', '点「创建比赛」主按钮', 'home:135']],
      todo: '「从好友里选择共同主持」等入口为 toast 占位'
    },
    profile: {
      name: '个人主页',
      route: 'pages/profile/index',
      file: 'src/pages/profile/index.vue',
      desc: '只从首页 dock 栏/头像进入，页内没有前进跳转，也没有对外分享入口。',
      out: [],
      back: [['← 上一页 / 兜底回首页', '左上角返回按钮 goBackOrHome', 'profile:4']],
      inn: [['首页 home → 本页', '点 dock-bar 整条 / dock-avatar', 'home:134']],
      todo: '钱包、全部勋章、广场、排行、主办方申请 均为 toast 占位'
    },
    room: {
      name: '房间',
      route: 'pages/room/index',
      file: 'src/pages/room/index.vue',
      desc: '入口最多的一页：首页扫码/邀请链接、创建页发布、分享卡片冷启动都能进来。',
      out: [['→ 房间（自身）', 'onShareAppMessage 的 path', 'room:457']],
      back: [
        ['← navigateBack 回上一页', '从 home→room 进入时，返回到首页', 'room:5'],
        ['← reLaunch 回首页', '从分享卡片冷启动时，页栈只有 1 层', 'nav.js:28']
      ],
      inn: [
        ['首页 home → 本页', '扫码成功 / 邀请链接确认', 'home:139 / home:155'],
        ['创建比赛 create → 本页', '发布按钮二次点击', 'create:546'],
        ['分享卡片 → 本页', 'path 直达（站外冷启动）', 'create:552 / room:457']
      ],
      todo: ''
    },
    share: {
      name: '分享卡片 / 邀请链接',
      route: '—（站外入口，非页面）',
      file: 'onShareAppMessage 的 path',
      desc: '不是真实页面，而是冷启动入口。点开后页栈里只有 room 一层，因此返回会走 reLaunch 回首页。',
      out: [['→ 房间 room', '分享卡片 path 为 /pages/room/index', 'create:552 / room:457']],
      back: [['—', '该入口本身不产生返回边', '']],
      inn: [],
      todo: ''
    }
  };

  var nodes = Array.prototype.slice.call(document.querySelectorAll('.zzr-node'));
  var edges = Array.prototype.slice.call(document.querySelectorAll('.zzr-edge'));
  var panel = document.getElementById('zzr-panel');
  var activeId = null;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function itemHtml(entry, cls) {
    var ref = entry[2] ? ' <span class="zzr-ref">' + esc(entry[2]) + '</span>' : '';
    return '<div class="zzr-item ' + cls + '">' +
             '<div class="zzr-i1">' + esc(entry[0]) + ref + '</div>' +
             '<div class="zzr-i2">' + esc(entry[1]) + '</div>' +
           '</div>';
  }

  function section(title, entries, cls) {
    if (!entries || !entries.length) {
      return '<div class="zzr-sec"><h3>' + title + '</h3><div class="zzr-empty">— 无 —</div></div>';
    }
    return '<div class="zzr-sec"><h3>' + title + '</h3>' +
      entries.map(function (e) { return itemHtml(e, cls); }).join('') + '</div>';
  }

  function renderOverview() {
    panel.innerHTML =
      '<h2>总览</h2>' +
      '<div class="zzr-route">4 个页面 · 6 条跳转边</div>' +
      '<p class="zzr-desc">全部跳转都用 <strong>uni.navigateTo</strong> 压栈，没有 tabBar / switchTab / redirectTo。' +
      '非首页共用 <strong>goBackOrHome()</strong> 返回：页栈 &gt; 1 层就 navigateBack 回上一页，否则 reLaunch 回首页。' +
      '同一页的返回落点会随入口不同（见 room）。</p>' +
      '<div class="zzr-hint">点击左侧任意节点或用 Tab 聚焦后回车，查看该页的出入口与代码位置。</div>';
  }

  function render(id) {
    var p = PAGES[id];
    if (!p) { renderOverview(); return; }
    panel.innerHTML =
      '<h2>' + esc(p.name) + '</h2>' +
      '<div class="zzr-route">' + esc(p.route) + '</div>' +
      '<div class="zzr-file">' + esc(p.file) + '</div>' +
      '<p class="zzr-desc">' + esc(p.desc) + '</p>' +
      section('出边 · 离开本页', p.out, 'fwd') +
      section('返回 · goBackOrHome', p.back, 'back') +
      section('入边 · 如何到达本页', p.inn, 'fwd') +
      (p.todo ? '<div class="zzr-hint">占位未接入：' + esc(p.todo) + '</div>' : '') +
      '<button class="zzr-reset" type="button" id="zzr-clear">清除选择</button>';

    var btn = document.getElementById('zzr-clear');
    if (btn) btn.addEventListener('click', function () { select(null); });
  }

  function select(id) {
    activeId = id || null;

    nodes.forEach(function (n) {
      var self = n.getAttribute('data-id');
      var linked = false;
      edges.forEach(function (e) {
        if ((e.getAttribute('data-from') === id && e.getAttribute('data-to') === self) ||
            (e.getAttribute('data-to') === id && e.getAttribute('data-from') === self)) {
          linked = true;
        }
      });
      var on = !id || self === id || linked;
      n.classList.toggle('is-active', !!id && self === id);
      n.classList.toggle('is-dim', !on);
    });

    edges.forEach(function (e) {
      var hit = !!id && (e.getAttribute('data-from') === id || e.getAttribute('data-to') === id);
      e.classList.toggle('is-dim', !!id && !hit);
      e.classList.toggle('is-hit', hit);
    });

    render(id);
  }

  nodes.forEach(function (n) {
    var id = n.getAttribute('data-id');
    n.addEventListener('click', function () { select(activeId === id ? null : id); });
    n.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
        ev.preventDefault();
        select(activeId === id ? null : id);
      }
    });
  });

  select(null);
})();
</script>
